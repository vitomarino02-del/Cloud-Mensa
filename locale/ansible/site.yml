# Configura il cluster Kubernetes (kubeadm) sulle 3 VM create da Terraform.
# Uso:  cd ansible && ansible-playbook site.yml

# ---- Play 1: prerequisiti identici su tutti i nodi ----
- name: Prerequisiti comuni a tutti i nodi
  hosts: k8s_cluster
  become: true

  pre_tasks:
    # le VM appena create stanno ancora eseguendo cloud-init, che tiene
    # occupato apt: senza questa attesa i task successivi restano appesi
    - name: Attendi che cloud-init abbia finito
      command: cloud-init status --wait
      failed_when: false
      changed_when: false

  tasks:
    - name: Disattiva la swap (richiesto da kubelet)
      command: swapoff -a
      changed_when: false

    - name: Moduli kernel per container e rete bridge
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Carica subito i moduli
      command: modprobe {{ item }}
      loop: [overlay, br_netfilter]
      changed_when: false

    - name: Parametri di rete richiesti da Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    # task normale e non handler: gli handler girano a fine play, quindi se il
    # playbook fallisce prima non vengono mai eseguiti, e al rilancio il task
    # sopra risulta "ok" e non li notifica piu'. Risultato: il file c'e' ma il
    # valore non e' caricato, e kubeadm init fallisce sul controllo ip_forward.
    - name: Applica i parametri sysctl
      command: sysctl --system
      changed_when: false

    - name: Installa containerd (il runtime dei container)
      apt:
        name: containerd
        state: present
        update_cache: true
        lock_timeout: 300

    - name: Configura containerd con cgroup systemd
      shell: |
        mkdir -p /etc/containerd
        containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml
      notify: riavvia containerd

    - name: Chiave APT del repository Kubernetes
      shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Repository Kubernetes
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
        state: present

    - name: Installa kubelet, kubeadm e kubectl
      apt:
        name: [kubelet, kubeadm, kubectl]
        state: present
        update_cache: true

    - name: Blocca gli aggiornamenti automatici dei pacchetti K8s
      command: apt-mark hold kubelet kubeadm kubectl
      changed_when: false

  handlers:
    - name: riavvia containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true

# ---- Play 2: inizializza il control plane ----
- name: Inizializza il control plane
  hosts: control_plane
  become: true
  tasks:
    - name: kubeadm init (solo se il cluster non esiste gia')
      command: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_host }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: kubeconfig per l'utente ubuntu della VM
      shell: |
        mkdir -p /home/ubuntu/.kube
        cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
        chown -R ubuntu:ubuntu /home/ubuntu/.kube
      args:
        creates: /home/ubuntu/.kube/config

    - name: Installa la rete dei pod (Flannel)
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Genera il comando di join per i worker
      command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: Scarica il kubeconfig sul PC (per usare kubectl da WSL)
      fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/kubeconfig"
        flat: true

# ---- Play 3: aggancia i worker ----
- name: Unisci i worker al cluster
  hosts: workers
  become: true
  tasks:
    - name: kubeadm join (solo se il nodo non e' gia' nel cluster)
      command: "{{ hostvars[groups['control_plane'][0]].join_cmd.stdout }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
