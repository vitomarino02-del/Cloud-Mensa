# order-service: 2 repliche per  la scalabilita' orizzontale
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: mensa
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: mavit2002/order-service:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: mensa-config }
          ports:
            - containerPort: 5002
          readinessProbe:
            httpGet: { path: /healthz, port: 5002 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: mensa
spec:
  selector: { app: order-service }
  ports:
    - port: 5002
