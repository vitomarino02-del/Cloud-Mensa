# menu-service: catalogo piatti
# imagePullPolicy IfNotPresent = scarica dal registro solo se non gia' presente sul nodo
kind: Deployment
metadata:
  name: menu-service
  namespace: mensa
spec:
  replicas: 1
  selector:
    matchLabels: { app: menu-service }
  template:
    metadata:
      labels: { app: menu-service }
    spec:
      containers:
        - name: menu-service
          image: mavit2002/menu-service:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: mensa-config }
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet: { path: /healthz, port: 5001 }
            initialDelaySeconds: 5
          volumeMounts:
            - { name: images, mountPath: /data/images }
      volumes:
        - name: images
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: menu-service
  namespace: mensa
spec:
  selector: { app: menu-service }
  ports:
    - port: 5001
