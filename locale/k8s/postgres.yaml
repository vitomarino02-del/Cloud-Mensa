# PostgreSQL: 1 replica + Service per il DNS interno ('postgres' come nel compose).
# Volume emptyDir: i dati vivono quanto il pod (per la demo va bene; in Fase 2 c'e' RDS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mensa
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: mensa }
            - { name: POSTGRES_PASSWORD, value: mensa }
            - { name: POSTGRES_DB, value: mensa }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mensa
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
